# GitHub Actions only, because a workflow is all this repository runs. The one action it calls
# is the conventions check, and that bump is the point of this file: Dependabot moves only the
# check.yml@ line, so its pull request goes red against conventions.json, and the red is the
# signal that this repository is behind a conventions release. Finish that pull request on its
# own branch — move the tag in conventions.json, run `sh conventions/conventions-sync sync` —
# rather than closing it. Without this file nothing said so, and this repository fell behind
# unseen while its siblings were told.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
